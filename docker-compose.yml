# docker compose up -d --build     (from a full checkout that has the model files)
# docker compose up -d             (after `docker load -i riskwise-docker.tar`)
# See docs/DOCKER.md. API keys are optional: without them the copilot runs in its offline mode.
services:
  backend:
    image: riskwise-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: riskwise-backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: sqlite:////app/db/riskwise.db
      OFFLINE_MODE: "true"
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - riskwise-db:/app/db
      - riskwise-runs:/app/artifacts/var_validation
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  frontend:
    image: riskwise-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: riskwise-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  riskwise-db:
  riskwise-runs:
