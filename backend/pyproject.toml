[project]
name = "riskwise-backend"
version = "0.1.0"
description = "FastAPI backend service for RiskWise financial risk intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
markers = [
    "requires_trained_model: needs the trained credit model files, which are gitignored (run scripts/train_indian_credit.py); skipped when absent",
]
testpaths = ["tests"]
pythonpath = [".", ".."]
